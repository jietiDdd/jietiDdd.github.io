<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#151819">
  <title>暗少角色喜好榜 · List Studio</title>
  <style>
    html,body{width:100%;height:100%;margin:0;overflow:hidden}
    iframe{display:block;width:100%;height:100vh;height:100dvh;border:0;background:#f6f5ef}
  </style>
</head>
<body>
<script>
(() => {
  const originalName = 'anshao-characters';
  const archivedName = originalName + '-original';
  const originalKey = 'rank-studio-v1-published-' + originalName;
  const archivedKey = 'rank-studio-v1-published-' + archivedName;

  // Move saved edits to the preserved page key without keeping a second full copy.
  try {
    const oldValue = localStorage.getItem(originalKey);
    if (oldValue !== null && localStorage.getItem(archivedKey) === null) {
      localStorage.removeItem(originalKey);
      try {
        localStorage.setItem(archivedKey, oldValue);
      } catch (error) {
        localStorage.setItem(originalKey, oldValue);
      }
    }
  } catch {}

  const frame = document.createElement('iframe');
  frame.title = '暗少角色喜好榜';
  frame.src = './' + archivedName + '.html';
  document.body.append(frame);

  frame.addEventListener('load', () => {
    let win, doc;
    try {
      win = frame.contentWindow;
      doc = frame.contentDocument;
    } catch {
      return;
    }
    if (!win || !doc) return;

    let storageFailureActive = false;
    const hideStorageWarning = () => document.getElementById('storageWarningDialog')?.remove();
    const setStorageFailure = active => {
      if (!active) { storageFailureActive = false; hideStorageWarning(); return; }
      if (storageFailureActive) return;
      storageFailureActive = true;
      const overlay = document.createElement('div');
      overlay.id = 'storageWarningDialog';
      overlay.setAttribute('role', 'alertdialog');
      overlay.setAttribute('aria-modal', 'true');
      overlay.setAttribute('aria-labelledby', 'storageWarningTitle');
      overlay.style.cssText = 'position:fixed;inset:0;z-index:99999;display:grid;place-items:center;padding:24px;background:rgba(14,20,18,.58)';
      const card = document.createElement('div');
      card.style.cssText = 'box-sizing:border-box;width:min(100%,440px);padding:28px;border-radius:20px;background:#fffef8;color:#202522;box-shadow:0 20px 70px rgba(0,0,0,.25);font:inherit';
      const title = document.createElement('h2');
      title.id = 'storageWarningTitle';
      title.textContent = '浏览器存储空间不足';
      title.style.cssText = 'margin:0 0 12px;font-size:22px';
      const message = document.createElement('p');
      message.textContent = '最近的更改未能自动保存。刷新或关闭页面可能会丢失未保存的数据，请先导出 JSON 保存。';
      message.style.cssText = 'margin:0 0 22px;line-height:1.7;color:#555';
      const actions = document.createElement('div');
      actions.style.cssText = 'display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end';
      const exportButton = document.createElement('button');
      exportButton.type = 'button';
      exportButton.textContent = '导出 JSON 保存';
      exportButton.style.cssText = 'border:0;border-radius:10px;padding:12px 16px;background:#d9f57a;color:#172017;font:inherit;font-weight:700;cursor:pointer';
      exportButton.addEventListener('click', () => doc.getElementById('jsonExport')?.click());
      const closeButton = document.createElement('button');
      closeButton.type = 'button';
      closeButton.textContent = '知道了';
      closeButton.style.cssText = 'border:1px solid #d9ddd4;border-radius:10px;padding:12px 16px;background:#fff;color:#333;font:inherit;cursor:pointer';
      closeButton.addEventListener('click', () => overlay.remove());
      actions.append(exportButton, closeButton);
      card.append(title, message, actions);
      overlay.append(card);
      document.body.append(overlay);
      exportButton.focus();
    };
    window.addEventListener('beforeunload', event => {
      if (!storageFailureActive) return;
      event.preventDefault();
      event.returnValue = '';
    });
    const checkStorageFailure = () => {
      const status = doc.getElementById('saveState');
      const failed = !!status && (status.classList.contains('storage-error') || status.textContent.includes('储存空间不足'));
      setStorageFailure(failed);
    };
    const status = doc.getElementById('saveState');
    if (status) {
      const observer = new win.MutationObserver(checkStorageFailure);
      observer.observe(status, { attributes: true, childList: true, characterData: true, subtree: true });
    }
    checkStorageFailure();

    let dragging = false;
    let pointerY = null;
    let scrollFrame = 0;

    const stopScrolling = () => {
      dragging = false;
      pointerY = null;
      if (scrollFrame) win.cancelAnimationFrame(scrollFrame);
      scrollFrame = 0;
    };

    const scrollWhileDragging = () => {
      if (!dragging || pointerY === null) {
        scrollFrame = 0;
        return;
      }
      const edge = 96;
      const y = pointerY;
      const delta = y < edge
        ? -Math.max(2, Math.min(24, (edge - y) * 0.35))
        : y > win.innerHeight - edge
          ? Math.max(2, Math.min(24, (y - (win.innerHeight - edge)) * 0.35))
          : 0;
      if (delta) win.scrollBy(0, delta);
      scrollFrame = win.requestAnimationFrame(scrollWhileDragging);
    };

    doc.addEventListener('dragstart', () => {
      dragging = true;
    }, true);
    doc.addEventListener('dragover', event => {
      if (!dragging) return;
      pointerY = event.clientY;
      if (!scrollFrame) scrollFrame = win.requestAnimationFrame(scrollWhileDragging);
    }, true);
    doc.addEventListener('drop', stopScrolling, true);
    doc.addEventListener('dragend', stopScrolling, true);

    doc.addEventListener('click', event => {
      if (!event.target.closest('#shareTemplate')) return;
      win.setTimeout(() => {
        const slug = doc.querySelector('#publishSlug');
        if (slug && slug.value === archivedName) {
          slug.value = originalName;
          slug.dispatchEvent(new win.Event('input', { bubbles: true }));
        }
      }, 0);
    }, true);
  });
})();
</script>
</body>
</html>
