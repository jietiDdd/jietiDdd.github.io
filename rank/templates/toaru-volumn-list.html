<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#151819">
  <title>魔禁每卷排行 · List Studio</title>
  <style>
    html,body{width:100%;height:100%;margin:0;overflow:hidden}
    iframe{display:block;width:100%;height:100vh;height:100dvh;border:0;background:#f6f5ef}
  </style>
</head>
<body>
<script src="../drag-feedback.js"></script>
<script>
(() => {
  const originalName = 'toaru-volumn-list';
  const originalKey = 'rank-studio-v1-published-' + originalName;
  const archivedName = originalName + '-original';

  // Move saved edits to the preserved page key without keeping a second full copy.
  try {
    const oldValue = localStorage.getItem(originalKey);
    const archivedKey = 'rank-studio-v1-published-' + archivedName;
    if (oldValue !== null && localStorage.getItem(archivedKey) === null) {
      localStorage.removeItem(originalKey);
      try {
        localStorage.setItem(archivedKey, oldValue);
      } catch (error) {
        localStorage.setItem(originalKey, oldValue);
      }
    }
  } catch {}

  const frame = document.createElement('iframe');
  frame.title = '魔禁每卷排行';
  frame.src = './' + archivedName + '.html';
  window.installRankDropFeedback(frame);
  document.body.append(frame);

  let storageFailureActive = false;
  let storageFailureObserver = null;
  const setStorageFailure = active => { storageFailureActive = active; };
  window.addEventListener('beforeunload', event => {
    if (!storageFailureActive) return;
    event.preventDefault();
    event.returnValue = '';
  });

  frame.addEventListener('load', () => {
    let win, doc;
    storageFailureObserver?.disconnect();
    try {
      win = frame.contentWindow;
      doc = frame.contentDocument;
    } catch {
      return;
    }
    if (!win || !doc) return;

    const checkStorageFailure = () => {
      const status = doc.getElementById('saveState');
      const failed = !!status && (status.classList.contains('storage-error') || status.textContent.includes('储存空间不足'));
      setStorageFailure(failed);
    };
    const status = doc.getElementById('saveState');
    if (status) {
      storageFailureObserver = new win.MutationObserver(checkStorageFailure);
      storageFailureObserver.observe(status, { attributes: true, childList: true, characterData: true, subtree: true });
    }
    checkStorageFailure();

    let dragging = false;
    let pointerY = null;
    let scrollFrame = 0;

    const stopScrolling = () => {
      dragging = false;
      pointerY = null;
      if (scrollFrame) win.cancelAnimationFrame(scrollFrame);
      scrollFrame = 0;
    };

    const scrollWhileDragging = () => {
      if (!dragging || pointerY === null) {
        scrollFrame = 0;
        return;
      }
      const edge = 96;
      const y = pointerY;
      const delta = y < edge
        ? -Math.max(2, Math.min(24, (edge - y) * 0.35))
        : y > win.innerHeight - edge
          ? Math.max(2, Math.min(24, (y - (win.innerHeight - edge)) * 0.35))
          : 0;
      if (delta) win.scrollBy(0, delta);
      scrollFrame = win.requestAnimationFrame(scrollWhileDragging);
    };

    doc.addEventListener('dragstart', () => {
      dragging = true;
    }, true);
    doc.addEventListener('dragover', event => {
      if (!dragging) return;
      pointerY = event.clientY;
      if (!scrollFrame) scrollFrame = win.requestAnimationFrame(scrollWhileDragging);
    }, true);
    doc.addEventListener('drop', stopScrolling, true);
    doc.addEventListener('dragend', stopScrolling, true);

    // Keep newly shared links pointed at the original public page URL.
    doc.addEventListener('click', event => {
      if (!event.target.closest('#shareTemplate')) return;
      win.setTimeout(() => {
        const slug = doc.querySelector('#publishSlug');
        if (slug && slug.value === archivedName) {
          slug.value = originalName;
          slug.dispatchEvent(new win.Event('input', { bubbles: true }));
        }
      }, 0);
    }, true);
  });
})();
</script>
</body>
</html>
